<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySync - Add Task</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">StudySync</div>
            <ul>
                <li><a href="index.html">Dashboard</a></li>
                <li><a href="add-task.html" class="active">Add Task</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="form-section">
            <h1>Create New Task</h1>
            <form id="task-form">
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" placeholder="e.g. Mathematics" required>
                </div>
                <div class="form-group">
                    <label for="task">Task Description</label>
                    <textarea id="task" rows="4" placeholder="What do you need to study?" required></textarea>
                </div>
                <div id="error-message" class="error"></div>
                <button type="submit" id="submit-btn">Save Task</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 StudySync. Built to help you achieve academic excellence.</p>
    </footer>
    
    <script src="script.js"></script>
</body>
</html>
