<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudySync - Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header>
        <!-- Navigation bar -->
        <nav>
            <img class="logoimg" src="StudySync3.jpg" alt="logo">
            <div class="logo-text">StudySync</div>
            <ul>
                <li><a href="index.html" class="active">Dashboard</a></li>
                <li><a href="add-task.html">Add Task</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>
    <!-- part of the body were the task entered will be displayed -->
    <main>
        <section id="hero-sec">
            <h1>Your Study Sessions</h1>
            <p>Track your progress and stay ahead of your schedule.</p>
        </section>

        <section id="task-display">
            <h2>Current Tasks</h2>
            <div id="task-container">
                <!-- JavaScript will intiate tasks here -->
                <p class="loader">No tasks found. Go to "Add Task" to schedule a task!</p>
            </div>
        </section>
        <img src="StudySync1.jpg" alt="Study-pic">
    </main>

    <footer>
        <p>&copy; 2026 StudySync. Built to help you achieve academic excellence.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
